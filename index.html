```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安否確認</title>
</head>

<body>

  <h1>安否確認</h1>

  <p>あなたの名前を選んでください。</p>

  <select id="name">
    <option value="">-- 名前を選択 --</option>
  </select>

  <h2>あなたの安否</h2>

  <button onclick="answer('無事')">🟢 無事</button>
  <button onclick="answer('けがあり')">🟡 けがあり</button>
  <button onclick="answer('帰宅困難')">🔴 帰宅困難</button>

  <p id="result"></p>

  <script>

    // 社員名簿を取得
    const employees =
      JSON.parse(localStorage.getItem('employees')) || [];

    const nameSelect =
      document.getElementById('name');

    // 社員名簿を名前の選択欄に表示
    employees.forEach(function(name) {

      const option =
        document.createElement('option');

      option.value = name;
      option.textContent = name;

      nameSelect.appendChild(option);

    });

    // 安否回答
    function answer(status) {

      const name =
        document.getElementById('name').value;

      if (name === '') {

        alert('名前を選択してください');

        return;
      }

      // 今までの回答を取得
      let answers =
        JSON.parse(localStorage.getItem('anpiAnswers')) || {};

      // この社員の回答を保存
      answers[name] = {
        status: status,
        time: new Date().toLocaleString('ja-JP')
      };

      localStorage.setItem(
        'anpiAnswers',
        JSON.stringify(answers)
      );

      // 画面に表示
      document.getElementById('result').textContent =
        name + 'さんの回答：' + status;

      alert('回答を保存しました');

    }

  </script>

</body>
</html>
```
