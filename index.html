<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安否確認</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      margin: 15px 0 30px;
    }

    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      font-size: 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>安否確認</h1>

  <p>あなたの名前を選んでください。</p>

  <select id="name">
    <option value="">-- 名前を選択 --</option>
    <option value="テスト太郎">テスト太郎</option>
    <option value="テスト花子">テスト花子</option>
    <option value="テスト次郎">テスト次郎</option>
  </select>

  <h2>あなたの安否</h2>

  <button onclick="answer('無事')">🟢 無事</button>
  <button onclick="answer('けがあり')">🟡 けがあり</button>
  <button onclick="answer('帰宅困難')">🔴 帰宅困難</button>

  <p id="result"></p>

  <script>

    function answer(status) {

      const name =
        document.getElementById('name').value;

      if (name === '') {
        alert('名前を選択してください');
        return;
      }

      let answers =
        JSON.parse(localStorage.getItem('anpiAnswers')) || {};

      answers[name] = {
        status: status,
        time: new Date().toLocaleString('ja-JP')
      };

      localStorage.setItem(
        'anpiAnswers',
        JSON.stringify(answers)
      );

      document.getElementById('result').textContent =
        name + 'さんの回答：' + status;

      alert('回答を保存しました');

    }

  </script>

</body>
</html>
